pool: mypool

trigger:
  - manin
  - feature/*

stages:
  - stage: Scan
    displayName: Tflint Scan
    jobs:
      - job: TFlint
        displayName: TFLint Scan
        steps:
        - task: PowerShell@2
          displayName: TFlint
          inputs:
            targetType: 'inline'
            script: |
              cd "$(Build.SourcesDirectory)/environment/Prod"
                      tflint --init
                      tflint
                    displayName: 'TFLint Scan'

  - stage: Plan
    displayName: Plan
    jobs:
      - job: Init
        steps:
        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Prod'
            backendServiceArm: 'mysc'
            backendAzureRmStorageAccountName: 'tfstatedisk'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'prod-tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Prod'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Prod'
            environmentServiceNameAzureRM: 'mysc'