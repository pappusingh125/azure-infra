
parameters:
- name: Apply
  displayName: Apply
  type: boolean
  default: false

stages:
- stage: Apply
  displayName: Apply
  condition: and(succeeded(), eq('${{ parameters.Apply }}', true))

  jobs:
  - job: Apply
    displayName: Apply Terraform

    steps:
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: azurerm
        command: init
        workingDirectory: '$(work_dir)'
        backendServiceArm: sharedsvc
        backendAzureRmResourceGroupName: '$(rg)'
        backendAzureRmStorageAccountName: '$(storage)'
        backendAzureRmContainerName: '$(Container)'
        backendAzureRmKey: dev-tfstate

    - task: TerraformTask@5
      displayName: Terraform Apply
      inputs:
        provider: azurerm
        command: apply
        workingDirectory: '$(work_dir)'
        environmentServiceNameAzureRM: sharedsvc
        commandOptions: '-auto-approve'
