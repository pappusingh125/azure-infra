variables:
- group: azure

parameters:
- name: Init
  displayName: Init
  default: false
  type: boolean

- name: Plan
  displayName: Plan
  default: false
  type: boolean

- name: Apply
  displayName: Apply
  default: false
  type: boolean

stages:
- template: templates/Init.yaml
  parameters:
    Init: ${{ parameters.Init }}

- template: templates/Init.yaml
  parameters:
    Plan: ${{ parameters.Plan }}

- template: templates/Init.yaml
  parameters:
    Apply: ${{ parameters.Apply }}