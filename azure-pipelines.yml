pool: mypool

parameters:
- name: RunTFLint
  displayName: RunTFLint
  type: boolean
  default: false

- name: RunTfsec
  displayName: Tfsec
  type: boolean
  default: false


trigger:
  - main
  - '*'

stages:
  - stage: TFLint
    displayName: Tflint
    jobs:
      - job: Tflink
        displayName: Tflint
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'tflint --recursive --force'

  - stage: Tfsec
    displayName: Tfsec
    jobs:
      - job: Tfsec
        displayName: Tfsec
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: |
              $(System.DefaultWorkingDirectory)/environment/Prod
              tfsec .

  - stage: Checkov
    displayName: Checkov
    jobs:
      - job: checkov
        displayName: checkov
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'checkov -d .$(System.DefaultWorkingDirectory)/environment/Prod --framework terraform'

  - stage: Validate
    displayName: Validate
    jobs:
      - job: Init
        displayName: Init
        steps:
        - task: TerraformTask@5
          displayName: Terraform init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Prod'
            backendServiceArm: 'mysc'
            backendAzureRmStorageAccountName: 'tfstatedisk'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'prod-tfstate'

        - task: TerraformTask@5
          displayName: Validate
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Prod'

  - stage: Plan
    displayName: Plan
    jobs:
      - job: Init
        displayName: Init
        steps:
        - task: TerraformTask@5
          displayName: Terraform init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Prod'
            backendServiceArm: 'mysc'
            backendAzureRmStorageAccountName: 'tfstatedisk'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'prod-tfstate'

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Prod'
            environmentServiceNameAzureRM: 'mysc'

  - stage: Approval
    displayName: Manual Approval
    pool: server
    jobs:
      - job: Approval
        displayName: Approval
        steps:
        - task: ManualValidation@1
          inputs:
            approvers: 'Please approve'
            instructions: 'Please approve'

  - stage: Apply
    displayName: Apply
    jobs:
      - job: apply
        displayName: Apply
        steps:
        - task: TerraformTask@5
          displayName: init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Prod'
            backendServiceArm: 'mysc'
            backendAzureRmStorageAccountName: 'tfstatedisk'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'prod-tfstate'

        - task: TerraformTask@5
          displayName: apply
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Prod'
            environmentServiceNameAzureRM: 'mysc'
        


    