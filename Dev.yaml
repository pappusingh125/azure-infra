  - stage: Plan
    displayName: Plan
    # condition: ${{ parameters.Plan }}
    # dependsOn: 
    #   - TFLint
    #   - Tfsec
    #   - Checkov
      
    jobs:
      - job: Plan
        displayName: Plan
        steps:
        - task: TerraformTask@5
          displayName: init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'
            backendServiceArm: 'mysc'
            backendAzureRmStorageAccountName: 'tfstatedisk'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'Dev-tfstate'

        - task: TerraformTask@5
          displayName: Validate
          inputs:
            provider: 'azurerm'
            command: 'validate'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'

        - task: TerraformTask@5
          displayName: plan
          inputs:
            provider: 'azurerm'
            command: 'plan'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'
            environmentServiceNameAzureRM: 'mysc'

  - stage: Approval
    displayName: Manual Approval
    # condition: ${{ parameters.Apply }}
    # dependsOn: Plan
    pool: server
    jobs:
      - job: Approval
        displayName: Approval
        steps:
        - task: ManualValidation@1
          displayName: approval
          inputs:
            notifyUsers: 'jdjd@123'
            allowApproversToApproveTheirOwnRuns: false
            instructions: 'Please approve'

  - stage: Apply
    displayName: Apply
    # condition: ${{ parameters.Apply }}
    # dependsOn: Plan
    jobs:
      - job: apply
        displayName: Apply
        steps:
        - task: TerraformTask@5
          displayName: init
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'
            backendServiceArm: 'mysc'
            backendAzureRmStorageAccountName: 'tfstatedisk'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'Dev-tfstate'

        - task: TerraformTask@5
          displayName: apply
          inputs:
            provider: 'azurerm'
            command: 'apply'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'
            environmentServiceNameAzureRM: 'mysc'
            
        