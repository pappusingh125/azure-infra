pool: mypool

variables:
- name: work_dir
  value: (System.DefaultWorkingDirectory)/environment/Dev

- name: rg
  value: b18g94

- name: storage
  value: tfstatedisk

- name: Container
  value: tfstate

parameters:
- name: Init
  displayName: Init
  default: false
  type: boolean

- name: Plan
  displayName: Plan
  default: false
  type: boolean

- name: Apply
  displayName: Apply
  default: false
  type: boolean


stages:
- stage: Init
  displayName: Init
  jobs:
  - job: Init
    displayName: Init
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(work_dir)'
        backendServiceArm: 'sharedsvc'
        backendAzureRmResourceGroupName: '$(rg)'
        backendAzureRmStorageAccountName: '$(storage)'
        backendAzureRmContainerName: '$(container'
        backendAzureRmKey: 'dev-tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'

- stage: Plan
  displayName: Plan
  jobs:
  - job: Init
    displayName: Init
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(work_dir)'
        backendServiceArm: 'sharedsvc'
        backendAzureRmResourceGroupName: '$(rg)'
        backendAzureRmStorageAccountName: '$(storage)'
        backendAzureRmContainerName: '$(container'
        backendAzureRmKey: 'dev-tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'
        environmentServiceNameAzureRM: 'sharedsvc'

- stage: Apply
  displayName: Apply
  jobs:
  - job: Init
    displayName: Init
    steps:
    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(work_dir)'
        backendServiceArm: 'sharedsvc'
        backendAzureRmResourceGroupName: '$(rg)'
        backendAzureRmStorageAccountName: '$(storage)'
        backendAzureRmContainerName: '$(container'
        backendAzureRmKey: 'dev-tfstate'

    - task: TerraformTask@5
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/environment/Dev'
        environmentServiceNameAzureRM: 'sharedsvc'