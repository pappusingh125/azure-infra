pool: mypool

variables:
- group: pappu_variable

# variables:
#   - name: Work_dir
#     value: $(System.DefaultWorkingDirectory)/environment/dev


stages:
    - stage: Validate
      displayName: Validate
      jobs:
          - job: Validate
            displayName: Validate
            steps:
            - task: TerraformTask@5
              inputs:
                provider: 'azurerm'
                command: 'init'
                workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
                backendServiceArm: 'sharedsvc'
                backendAzureRmResourceGroupName: '$(RESOURCE-GROUP)'
                backendAzureRmStorageAccountName: '$(saurav0231231)'
                backendAzureRmContainerName: '$(CONTAINER-NAME)'
                backendAzureRmKey: 'pappu_tfstate'